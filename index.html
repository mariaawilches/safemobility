<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Safe Mobility Indicator Catalogue</title>
<style>
:root{--navy:#1F4E79;--blue:#2E75B6;--red:#C0504D;--green:#4E8542;--amber:#D9902B;--grey:#5A6673;--ink:#1F2A37;--light:#F2F4F7;--line:#D9DEE5}
*{box-sizing:border-box}body{margin:0;font-family:Calibri,Arial,Helvetica,sans-serif;color:var(--ink);background:#fff}
header{background:var(--navy);color:#fff;padding:16px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:22px;font-family:Cambria,Georgia,serif}header p{margin:4px 0 0;font-size:13px;color:#CADCFC}
.lang button{background:transparent;border:1px solid #8FB3D9;color:#fff;padding:6px 12px;margin-left:4px;border-radius:6px;cursor:pointer;font-size:13px}.lang button.on{background:#fff;color:var(--navy);font-weight:bold}
.bar{padding:12px 24px;background:var(--light);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end}
.bar label{display:block;font-size:11px;color:var(--grey);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.bar input[type=search]{width:360px;max-width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:4px}.chip{border:1px solid var(--line);background:#fff;padding:5px 10px;border-radius:14px;font-size:12.5px;cursor:pointer;user-select:none}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}.chip.T.on{background:var(--blue);border-color:var(--blue)}.chip.S.on{background:var(--red);border-color:var(--red)}.chip.A.on{background:var(--green);border-color:var(--green)}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center}.tools button{padding:7px 12px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-size:13px}.tools button.on{background:var(--navy);color:#fff}
.count{padding:8px 24px;font-size:13px;color:var(--grey);display:flex;gap:16px;flex-wrap:wrap;align-items:center}.count b{color:var(--ink)}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
.help{padding:0 24px 8px;font-size:12.5px;color:var(--grey);font-style:italic}
main{padding:8px 24px 40px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{border:1px solid var(--line);border-left:5px solid var(--grey);border-radius:8px;padding:12px 14px;background:#fff;cursor:pointer;transition:box-shadow .15s}.card:hover{box-shadow:0 2px 10px rgba(0,0,0,.12)}
.card.T{border-left-color:var(--blue)}.card.S{border-left-color:var(--red)}.card.A{border-left-color:var(--green)}
.card .id{font-weight:bold;font-size:12px;color:var(--grey);letter-spacing:.5px}.card h3{margin:4px 0 6px;font-size:15px;line-height:1.3;font-family:Cambria,Georgia,serif;color:var(--navy)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}.tag{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--light);color:var(--ink)}
.tag.E{background:#C6EFCE}.tag.C{background:#FFF2CC}.tag.N{background:#F8CBAD}.tag.NI{background:#EDEDED}.tag.fun{background:#DDEBF7}
.trig{font-size:12.5px;color:var(--grey)}.trig b{color:var(--ink)}
.det{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;font-size:12.5px}.card.open .det{display:block}
.det dt{font-weight:bold;color:var(--navy);margin-top:6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}.det dd{margin:1px 0 0}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}.tbl th{background:var(--navy);color:#fff;text-align:left;padding:7px 8px;position:sticky;top:0}.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.T td:first-child{border-left:5px solid var(--blue)}.tbl tr.S td:first-child{border-left:5px solid var(--red)}.tbl tr.A td:first-child{border-left:5px solid var(--green)}
.empty{padding:40px;text-align:center;color:var(--grey)}

.cbtn{float:right;border:1px solid var(--navy);color:var(--navy);background:#fff;border-radius:12px;padding:3px 10px;font-size:12px;cursor:pointer}.cbtn.has{background:var(--amber);border-color:var(--amber);color:#fff}
.fb{display:none;margin-top:10px;background:#FFFBEA;border:1px solid #F1E3A6;border-radius:8px;padding:10px}.fb h4{margin:0 0 6px;font-size:12px;color:var(--navy);text-transform:uppercase;letter-spacing:.4px}
.fb .opts{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}.fb .opt{border:1px solid var(--line);background:#fff;padding:4px 9px;border-radius:12px;font-size:12px;cursor:pointer}.fb .opt.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.fb select,.fb textarea{width:100%;font:inherit;font-size:12.5px;padding:6px;border:1px solid var(--line);border-radius:6px;margin-top:4px}.fb textarea{min-height:60px;resize:vertical}.fb.show{display:block}.fb .st{font-size:11px;color:var(--grey);margin-top:4px}.fb .send{margin-top:6px;background:var(--navy);color:#fff;border:none;border-radius:6px;padding:7px 14px;font-size:13px;cursor:pointer}.fb .send:disabled{opacity:.6}
.badge{display:inline-block;background:var(--amber);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;margin-left:6px;vertical-align:middle}
.who input{padding:7px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;width:230px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9;align-items:center;justify-content:center}.modal.on{display:flex}.box{background:#fff;border-radius:10px;width:min(820px,94vw);max-height:86vh;overflow:auto;padding:18px 20px}.box h2{margin:0 0 10px;font-size:18px;color:var(--navy);font-family:Cambria,Georgia,serif}.box .row{border-bottom:1px solid var(--line);padding:8px 0;font-size:13px}.box .row b{color:var(--navy)}.box .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.box .acts button{padding:7px 12px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer}.box .acts button.p{background:var(--navy);color:#fff}
@media print{.fb,.modal,.who{display:none}header,.bar,.help,.tools{display:none}.card{break-inside:avoid;box-shadow:none}.card .det{display:block}main{padding:0}}
</style></head><body>
<header><div><h1 id="t"></h1></div><div class="lang"><button data-l="en">EN</button><button data-l="es">ES</button><button data-l="pt">PT</button></div></header>
<div class="bar">
 <div><label id="l-search">Search</label><input type="search" id="q"></div>
 <div><label id="l-dom"></label><div class="chips" id="f-dom"></div></div>
 <div><label id="l-lvl"></label><div class="chips" id="f-lvl"></div></div>
 <div><label id="l-fun"></label><div class="chips" id="f-fun"></div></div>
 <div><label id="l-op"></label><div class="chips" id="f-op"></div></div>
 <div><label id="l-dt"></label><div class="chips" id="f-dt"></div></div>
 <div class="who"><label id="l-who"></label><input id="who" type="text"></div><div class="tools"><button id="b-mine" class="on"></button><button id="b-ess"></button><button id="b-view"></button><button id="b-print"></button><button id="b-clear"></button></div>
</div>
<div class="count" id="count"></div><div class="help" id="help"></div>
<main><div id="out"></div></main>
<div class="modal" id="modal"><div class="box"><h2 id="m-title"></h2><div id="m-list"></div><div class="acts"><button class="p" id="m-csv"></button><button id="m-copy"></button><button id="m-mail"></button><button id="m-close"></button></div></div></div>

ence, width, surface, crossings, land use mix; aggregate by corridor/zone; perception of safety and secur. See “Composite Scoring Rubrics” sheet.", "dis": "Sexo; Edad; Zone; Income area; Road hierarchy", "calc": "normalised components combined to a 0–100 figure vs a reference", "dirn": "↑ Higher is better", "win": "Full walking audit of city network takes 1–3 months depending on size. Individual corridors: 1–2 weeks. Re-audit annually for condition changes.", "lim": "Composite indices obscure which specific element drives the score. Auditor subjectivity in condition ratings despite checklists. Seasonal variation (wet season damages not visible in dry-season audit). Does not capture temporal use patterns."}, {"id": "T-D06", "dom": "T", "fun": "D", "funl": {"en": "Determinant", "es": "Determinante", "pt": "Determinante"}, "lvl": "E", "op": "Observed", "dt": "Percentage", "unit": "%", "refs": 22, "sdg": "", "v1": "TR-20, TR-34, TR-25", "name": {"en": "Infrastructure meeting universal accessibility (incl. accessible signals, crossing times)", "es": "Infraestructura y servicios con accesibilidad universal (incl. señales accesibles y tiempos de cruce)", "pt": "Infraestrutura e serviços com acessibilidade universal (incl. sinais acessíveis e tempos de travessia)"}, "trig": {"en": "(always)", "es": "(siempre)", "pt": "(sempre)"}, "subj": {"en": "Stations, stops, vehicles, crossings", "es": "Estaciones, paradas, vehículos, cruces", "pt": "Estações, paradas, veículos, travessias"}, "scope": {"en": "[treated assets]", "es": "[activos intervenidos]", "pt": "[ativos intervencionados]"}, "thr": {"en": "Standard: 100 % of new assets compliant (ISO 21542 / national standard). Crossing time: design speed ≤ 1.1 m/s (3.5 ft/s) and ≤ 0.9 m/s where ≥ 20 % older adults; walk interval ≥ 7 s.", "es": "Norma: 100 % de activos nuevos conformes (ISO 21542 / norma nacional). Tiempo de cruce: velocidad de diseño ≤ 1,1 m/s (3,5 pies/s) y ≤ 0,9 m/s donde ≥ 20 % adultos mayores; intervalo de camin le for annual coverage.", "lim": "Inspection pass rates reflect the stringency of the inspection regime, not actual vehicle condition. Corruption in inspection systems (common in LAC) inflates pass rates. Informal vehicles may evade the system entirely."}, {"id": "T-D15", "dom": "T", "fun": "D", "funl": {"en": "Determinant", "es": "Determinante", "pt": "Determinante"}, "lvl": "C", "op": "Observed", "dt": "Percentage", "unit": "%", "refs": 8, "sdg": "", "v1": "TR-04", "name": {"en": "Users wearing helmets/seatbelts correctly", "es": "Usuarios que usan casco y cinturón correctamente", "pt": "Usuários que usam capacete e cinto corretamente"}, "trig": {"en": "high motorcycle share (e.g. DR); behaviour programmes", "es": "alta participación de motocicletas (p. ej. RD); programas de comportamiento", "pt": "alta participação de motocicletas (p. ex. RD); programas de comportamento"}, "subj": {"en": "Motorcyclists / occupants", "es": "Motociclistas / ocupantes", "pt": "Motociclistas / ocupantes"}, "scope": {"en": "[observed corridors]", "es": "[corredores observados]", "pt": "[corredores observados]"}, "thr": {"en": "UN Target 7: correct helmet use close to 100 % (2030). UN Target 8: seatbelt / child restraint use close to 100 %.", "es": "Meta 7 ONU: uso correcto de casco cercano al 100 % (2030). Meta 8 ONU: cinturón / sistemas de retención infantil cercano al 100 %.", "pt": "Meta 7 ONU: uso correto de capacete próximo de 100 % (2030). Meta 8 ONU: cinto / dispositivos de retenção infantil próximo de 100 %."}, "thrt": {"en": "Global / regional target", "es": "Meta global / regional", "pt": "Meta global / regional"}, "src": {"en": "UN voluntary targets (7 and 8)", "es": "Metas voluntarias ONU (7 y 8)", "pt": "UN voluntary targets (7 and 8)"}, "expert": {"en": "Armijos (motorcycles in DR)", "es": "Armijos (motos en RD)", "pt": "Armijos (motorcycles in DR)"}, "desc": "Observed seatbelt wearing rate (front and rear seat) and motorcycle/powered two-wheeler helmet wearing rate, measured through standardised roadside observation", "how": "Standardised roadside observation surveys at representative locations; record seatbelt use by position and helmet use by rider/passenger", "dis": "Restraint type; Seat position/rider type; Sex; Vehicle type", "calc": "(units meeting the condition) ÷ (total units in scope) × 100", "dirn": "↑ Higher is better", "win": "Minimum 500 observations per mode per round across 2–3 days. Repeat quarterly to capture trends and enforcement effects.", "lim": "Observes front-seat only for seatbelts — rear-seat compliance typically lower but harder to observe. Motorcycle helmet quality (certified vs. novelty) not distinguishable from roadside. Observer positioning affects visibility. Night-time observation very difficult."}, {"id": "T-D16", "dom": "T", "fun": "D", "funl": {"en": "Determinant", "es": "Determinante", "pt": "Determinante"}, "lvl": "N", "op": "Observed", "dt": "Percentage", "unit": "%", "refs": 8, "sdg": "", "v1": "2", "name": {"en": "Drivers yielding to pedestrians at crossings", "es": "Conductores que ceden el paso a peatones en cruces", "pt": "Condutores que cedem passagem a pedestres nas travessias"}, "trig": {"en": "treated crossings; campaigns", "es": "cruces intervenidos; campañas", "pt": "travessias intervencionadas; campanhas"}, "subj": {"en": "Drivers", "es": "Conductores", "pt": "Condutores"}, "scope": {"en": "[treated crossings]", "es": "[cruces intervenidos]", "pt": "[travessias intervencionadas]"}, "thr": {"en": "No standard; yielding rates vary widely (≈ 20–80 %). Local before/after target.", "es": "Sin norma; tasas de cesión muy variables (≈ 20–80 %). Meta antes/después local.", "pt": "Sem norma; taxas de cessão muito variáveis (≈ 20–80 %). Meta antes/depois local."}, "thrt": {"en": "Empirical reference", "es": "Referencia empírica", "pt": "Referência empírica"}, "src": {"en": "Literature (yielding)", "es": "Literatura (yielding)", "pt": "Literature (yielding)"}, "expert": {"en": "", "es": "", "p , "es": "", "pt": ""}, "desc": "Public transport fare as % of minimum wage / household income", "how": "Calculate average fare per trip as % of daily minimum wage and as % of average household income in lowest quintile; report by route/mode", "dis": "Sex; Age group; Income quintile; Trip type; Zone", "calc": "(events / measured quantity) ÷ (exposure or population at risk) × k", "dirn": "↓ Lower is better", "win": "Household expenditure survey or fare analysis: 2–4 weeks. Income data from census or employment surveys. Annual update.", "lim": "Average affordability masks extreme variation — lowest-income households may spend 30%+ on transport. Fare structure complexity (transfers, time-of-day pricing) makes simple ratios misleading. Does not capture the cost of not travelling (foregone opportunities)."}, {"id": "T-D23", "dom": "T", "fun": "D", "funl": {"en": "Determinant", "es": "Determinante", "pt": "Determinante"}, "lvl": "N", "op": "Observed", "dt": "Index", "unit": "Score 0–100", "refs": 19, "sdg": "", "v1": "TR-14, TR-15, TR-26", "name": {"en": "Stations/interchanges with safe design (modal integration, platform edge, platform behaviour)", "es": "Estaciones e intercambiadores con diseño seguro (integración modal, borde de andén, comportamiento en andén)", "pt": "Estações e terminais com desenho seguro (integração modal, borda de plataforma, comportamento na plataforma)"}, "trig": {"en": "station, metro, BRT", "es": "estación, metro, BRT", "pt": "estação, metrô, BRT"}, "subj": {"en": "Stations / interchanges", "es": "Estaciones / intercambiadores", "pt": "Estações / terminais"}, "scope": {"en": "[treated stations]", "es": "[estaciones intervenidas]", "pt": "[estações intervencionadas]"}, "thr": {"en": "No single standard; platform edges/doors per metro standard. Target: 100 % of treated stations.", "es": "Sin norma única; bordes/puertas de andén según norma de metro. Meta: 100 % estaciones intervenidas.", "pt": "Sem norma única; bordas/portas de plataforma conform 6", "dom": "T", "fun": "D", "funl": {"en": "Determinant", "es": "Determinante", "pt": "Determinante"}, "lvl": "C", "op": "Observed", "dt": "Index", "unit": "Score (composite) / Minutes", "refs": 6, "sdg": "11.2.1", "v1": "TR-18", "name": {"en": "Social infrastructure safely accessible on foot", "es": "Infraestructura social (escuelas, salud, mercados) accesible a pie de forma segura", "pt": "Infraestrutura social (escolas, saúde, mercados) acessível a pé com segurança"}, "trig": {"en": "proximity / 15-minute city; peripheral neighbourhoods", "es": "proximidad / ciudad de 15 min; barrios periféricos", "pt": "proximidade / cidade de 15 min; bairros periféricos"}, "subj": {"en": "Facilities", "es": "Equipamientos", "pt": "Equipamentos"}, "scope": {"en": "[area of influence]", "es": "[área de influencia]", "pt": "[área de influência]"}, "thr": {"en": "Reference: ≤ 300 m (≈ 5 min) to public green space (3-30-300 rule); ≤ 500 m to public transport (SDG 11.2.1); “15-minute city”.", "es": "Referencia: ≤ 300 m (≈ 5 min) a espacio verde público (regla 3-30-300); ≤ 500 m a transporte público (ODS 11.2.1); “ciudad de 15 minutos”.", "pt": "Referência: ≤ 300 m (≈ 5 min) a espaço verde (regra 3-30-300); ≤ 500 m ao transporte público (ODS 11.2.1); “cidade de 15 minutos”."}, "thrt": {"en": "Empirical reference", "es": "Referencia empírica", "pt": "Referência empírica"}, "src": {"en": "Konijnendijk 2022; SDG 11.2.1 metadata", "es": "Konijnendijk 2022; metadatos ODS 11.2.1", "pt": "Konijnendijk 2022; SDG 11.2.1 metadata"}, "expert": {"en": "Sagaris (proximity)", "es": "Sagaris (proximidad)", "pt": "Sagaris (proximity)"}, "desc": "Accessibility of social infrastructure (schools, clinics, markets) within 30 min by public transport", "how": "GIS isochrone analysis from transit stops: calculate % of population reaching schools, health centres, and markets within 30 min by PT. See “Composite Scoring Rubrics” sheet.", "dis": "Sex; Age group; Facility type (school/clinic/market); Income quintile; Zone", "calc": "normalised components combined to a 0–100 figure vs a reference", "dirn": "↑ Higher is better", "win": "GIS mapping + field verification: 2–4 weeks. Census data overlay. Annual update.", "lim": "Proximity ≠ accessibility — physical barriers, safety concerns, and service hours matter. Social infrastructure inventory may be incomplete. Does not capture quality of services at accessible locations."}, {"id": "T-D27", "dom": "T", "fun": "D", "funl": {"en": "Determinant", "es": "Determinante", "pt": "Determinante"}, "lvl": "NI", "op": "Observed", "dt": "Percentage", "unit": "%", "refs": 7, "sdg": "", "v1": "TR-36", "name": {"en": "Equity-directed transport investment share", "es": "Inversión en transporte dirigida a comunidades de menor ingreso", "pt": "Investimento em transporte direcionado a comunidades de menor renda"}, "trig": {"en": "investment policy; territorial equity", "es": "política de inversión; equidad territorial", "pt": "política de investimento; equidade territorial"}, "subj": {"en": "Investment", "es": "Inversión", "pt": "Investimento"}, "scope": {"en": "[programme]", "es": "[programa]", "pt": "[programa]"}, "thr": {"en": "No standard; equity reference: investment ≥ proportional to the crash burden/exposure of lower-income neighbourhoods.", "es": "Sin norma; referencia de equidad: inversión ≥ proporcional a la carga de siniestros/exposición de barrios de menor ingreso.", "pt": "Sem norma; referência de equidade: investimento ≥ proporcional à carga de sinistros/exposição dos bairros de menor renda."}, "thrt": {"en": "Parity reference", "es": "Referencia de paridad", "pt": "Referência de paridade"}, "src": {"en": "—", "es": "—", "pt": "—"}, "expert": {"en": "", "es": "", "pt": ""}, "desc": "% of transport infrastructure investment directed to communities in lowest income quintile", "how": "Budget analysis: map capital expenditure on pedestrian, cycling, transit infrastructure by geographic area; cross-reference with census income data", "dis": "Sexo; Edad; Income quintile; Zone; Investment type", "calc": "(units meeting the condition) ÷ (total units in scope) × 100", "dirn": "↑ Higher is better", "win": "Budget analysis: 2–4 weeks per fiscal year. Annual measurement aligned with budget cycle.", "lim": "Defining which investments are 'equity-directed' requires normative judgement. Budget allocation ≠ actual expenditure ≠ benefit received. Geographic targeting by income may miss vulnerable populations in mixed-income areas. Capital vs. operational spending distinction matters."}, {"id": "T-I01", "dom": "T", "fun": "I", "funl": {"en": "Institutional enabler", "es": "Habilitante institucional", "pt": "Habilitador institucional"}, "lvl": "NI", "op": "—", "dt": "Dichotomous", "unit": "Binary (Yes/No) + coverage score", "refs": 8, "sdg": "", "v1": "TR-06", "name": {"en": "Integrated safe-mobility policy in place", "es": "Política integrada de movilidad segura adoptada", "pt": "Política integrada de mobilidade segura adotada"}, "trig": {"en": "institutional / policy component", "es": "componente institucional / de política", "pt": "componente institucional / de política"}, "subj": {"en": "Policy", "es": "Política", "pt": "Política"}, "scope": {"en": "[jurisdiction]", "es": "[jurisdicción]", "pt": "[jurisdição]"}, "thr": {"en": "Dichotomous: exists + implemented (plan, budget, monitoring).", "es": "Dicotómico: existe + implementada (plan, presupuesto, seguimiento).", "pt": "Dicotômico: existe + implementada (plano, orçamento, monitoramento)."}, "thrt": {"en": "Dichotomous (exists / implemented)", "es": "Dicotómico (existe / implementado)", "pt": "Dicotômico (existe / implementado)"}, "src": {"en": "UN Target 1 (action plans)", "es": "Meta 1 ONU (planes de acción)", "pt": "UN Target 1 (action plans)"}, "expert": {"en": "", "es": "", "pt": ""}, "desc": "Existence of an integrated policy or strategy explicitly covering all three risk domains (traffic safety + personal security + environmental harm) with assigned institutional responsibility", "how": "Policy document review; score for domain coverage, institutional responsibility assignment, budget allocation, monitoring framework. See “Composite Scoring Rubrics” sheet.", "dis": "Sexo; Edad; Domain coverage; Enforcement status; Budget allocation", "calc": "1 = framework/condition in place; 0 = not in place", "dirn": "↑ Higher is better", "win": "Policy document review: 1–2 weeks. Stakeholder interviews for implementation: 2–3 weeks. Annual.", "lim": "Policy adoption is binary — does not measure implementation quality. Political rhetoric may outpace actual commitment. Integration across three domains is genuinely rare and hard to verify. Policy durability (survival across political cycles) is the real test."}, {"id": "T-I02", "dom": "T", "fun": "I", "funl": {"en": "Institutional enabler", "es": "Habilitante institucional", "pt": "Habilitador institucional"}, "lvl": "NI", "op": "—", "dt": "Dichotomous", "unit": "Composite score (0–100)", "refs": 8, "sdg": "", "v1": "TR-11, PS-02", "name": {"en": "Data system producing sex-, age- & disability-disaggregated data", "es": "Sistema de datos que produce información desagregada por sexo, edad y discapacidad", "pt": "Sistema de dados que produz informação desagregada por sexo, idade e deficiência"}, "trig": {"en": "institutional / data component", "es": "componente institucional / datos", "pt": "componente institucional / dados"}, "subj": {"en": "Data system", "es": "Sistema de datos", "pt": "Sistema de dados"}, "scope": {"en": "[jurisdiction]", "es": "[jurisdicción]", "pt": "[jurisdição]"}, "thr": {"en": "Dichotomous + coverage: produces data by sex and age at minimum (disability, income where possible).", "es": "Dicotómico + cobertura: produce datos por sexo y edad como mínimo (discapacidad, ingreso donde sea posible).", "pt": "Dicotômico + cobertura: produz dados por sexo e idade no mínimo (deficiência, renda quando possível)."}, "thrt": {"en": "Dichotomous (exists / implement  control sites", "dis": "Intervention type; Space type; Income area; Sex", "calc": "(units meeting the condition) ÷ (total units in scope) × 100", "dirn": "↑ Higher is better", "win": "Minimum 2 years pre-intervention + 2 years post-intervention crime data for before-after analysis. Total observation window: 4+ years.", "lim": "Crime displacement to adjacent areas is the primary concern — reduction at the site may mean relocation, not prevention. Regression to mean if sites were selected because of high crime. Concurrent policing changes confound attribution. Long time span means neighbourhood demographic changes."}, {"id": "S-R08", "dom": "S", "fun": "R", "funl": {"en": "Outcome", "es": "Resultado", "pt": "Resultado"}, "lvl": "C", "op": "Perceived", "dt": "Percentage", "unit": "%", "refs": 10, "sdg": "", "v1": "PS-55", "name": {"en": "Migrants/displaced people reporting transport barriers", "es": "Personas migrantes o desplazadas que reportan barreras de transporte", "pt": "Pessoas migrantes ou deslocadas que relatam barreiras de transporte"}, "trig": {"en": "corridors with migrant / displaced population", "es": "corredores con población migrante/desplazada", "pt": "corredores com população migrante/deslocada"}, "subj": {"en": "Migrants", "es": "Personas migrantes", "pt": "Pessoas migrantes"}, "scope": {"en": "[area of influence]", "es": "[área de influencia]", "pt": "[área de influência]"}, "thr": {"en": "No standard; local baseline.", "es": "Sin norma; línea base local.", "pt": "Sem norma; linha de base local."}, "thrt": {"en": "No standard — local baseline and target", "es": "Sin norma — línea base y meta locales", "pt": "Sem norma — linha de base e meta locais"}, "src": {"en": "—", "es": "—", "pt": "—"}, "expert": {"en": "", "es": "", "pt": ""}, "desc": "% of migrant and displaced populations reporting transport-related barriers to accessing essential services (healthcare, education, employment, legal), disaggregated by documentation status and gender", "how": "Targeted survey of migrant/displaced populations in project areas, administered in partnership with migration/refugee services. Include questions on documentation barriers (ID requirements for fare ca", "dis": "Migration status; Sex; Service type (health/education/employment/legal); Income level", "calc": "(units meeting the condition) ÷ (total units in scope) × 100", "dirn": "↓ Lower is better", "win": "Survey requiring multilingual capacity: 3–4 weeks. Must access migrant communities through trusted organisations. n ≥ 300. Annual.", "lim": "Hard-to-reach population with high mobility — sample representativeness is a major concern. Language barriers affect survey quality. Legal status fears may suppress participation. 'Migrant' category is heterogeneous (nationality, legal status, duration)."}, {"id": "S-R09", "dom": "S", "fun": "R", "funl": {"en": "Outcome", "es": "Resultado", "pt": "Resultado"}, "lvl": "C", "op": "Observed", "dt": "Index", "unit": "Composite index (0–100)", "refs": 8, "sdg": "", "v1": "PS-56", "name": {"en": "Climate–violence–mobility index (exploratory)", "es": "Índice clima–violencia–movilidad (exploratorio)", "pt": "Índice clima–violência–mobilidade (exploratório)"}, "trig": {"en": "combined climate and gender vulnerability", "es": "vulnerabilidad climática y de género combinadas", "pt": "vulnerabilidade climática e de gênero combinadas"}, "subj": {"en": "Households / users", "es": "Hogares/usuarios", "pt": "Domicílios / usuários"}, "scope": {"en": "[area of influence]", "es": "[área de influencia]", "pt": "[área de influência]"}, "thr": {"en": "Exploratory; no standard.", "es": "Exploratorio; sin norma.", "pt": "Exploratório; sem norma."}, "thrt": {"en": "No standard — local baseline and target", "es": "Sin norma — línea base y meta locales", "pt": "Sem norma — linha de base e meta locais"}, "src": {"en": "—", "es": "—", "pt": "—"}, "expert": {"en": "", "es": "", "pt": ""}, "desc": "Composite measuring how climate vulnerability amplifies gender-based barriers to safe active travel: intersection of environmental exposure, GBV risk, and infrastructure inadequacy", "how": "Combine climate vulnerability data, GBV prevalence data, and cycling/walking infrastructure quality in spatial analysis; identify areas where all three factors coincide. See “Composite Scoring Rubrics” sheet.", "dis": "Sex; Zone; Climate hazard type; Infrastructure quality", "calc": "normalised components combined to a 0–100 figure vs a reference", "dirn": "↓ Lower is better", "win": "Cross-sectoral data assembly: 3–6 months. Annual measurement. Minimum 3 years for trend establishment.", "lim": "Emerging concept with no validated methodology — any index construction is exploratory. Causal pathways between climate, violence, and mobility are complex and bidirectional. Data availability for all three dimensions simultaneously is rare in LAC."}, {"id": "S-D01", "dom": "S", "fun": "D", "funl": {"en": "Determinant", "es": "Determinante", "pt": "Determinante"}, "lvl": "N", "op": "Observed", "dt": "Percentage", "unit": "%", "refs": 13, "sdg": "11.7.1", "v1": "PS-07, PS-13", "name": {"en": "Stations, stops & access zones meeting CPTED / safe-design criteria", "es": "Estaciones, paradas y accesos que cumplen criterios CPTED / diseño seguro", "pt": "Estações, paradas e acessos que cumprem critérios CPTED / desenho seguro"}, "trig": {"en": "station, stop or public space intervened", "es": "estación, parada o espacio público intervenido", "pt": "estação, parada ou espaço público intervencionado"}, "subj": {"en": "Stations / stops / access zones", "es": "Estaciones / paradas / accesos", "pt": "Estações / paradas / acessos"}, "scope": {"en": "[treated assets + 400 m]", "es": "[activos intervenidos + 400 m]", "pt": "[ativos intervencionados + 400 m]"}, "thr": {"en": "No single standard; method: Women’s Safety Audit (METRAC 1989 / UN-Habitat Safer Cities) and CPTED checklists. Target: 100 % of treated assets compliant.", "es": "Sin norma única; método:  de ocultamiento y atrapamiento", "pt": "Rotas de acesso sem risco de ocultação e encurralamento"}, "trig": {"en": "access routes to stations; public space", "es": "rutas de acceso a estaciones; espacio público", "pt": "rotas de acesso a estações; espaço público"}, "subj": {"en": "Access routes", "es": "Rutas de acceso", "pt": "Rotas de acesso"}, "scope": {"en": "[routes within 400 m of stations]", "es": "[rutas a 400 m de estaciones]", "pt": "[rotas a 400 m de estações]"}, "thr": {"en": "No standard; audit (concealment/entrapment). Local target.", "es": "Sin norma; auditoría (ocultamiento/atrapamiento). Meta local.", "pt": "Sem norma; auditoria (ocultação/encurralamento). Meta local."}, "thrt": {"en": "No standard — local baseline and target", "es": "Sin norma — línea base y meta locales", "pt": "Sem norma — linha de base e meta locais"}, "src": {"en": "—", "es": "—", "pt": "—"}, "expert": {"en": "", "es": "", "pt": ""}, "desc": "Assessment of public spaces and transit access routes for concealment-producing design features (dense unmanaged planting, physical enclosure, reduced exit options) that elevate fear", "how": "Walk-through audit using concealment/entrapment protocol: score planting density, enclosure, exit options, blind spots, isolation per location. See “Composite Scoring Rubrics” sheet.", "dis": "Sexo; Edad; Space type (park/transit stop/underpass); Zone; Time of day", "calc": "normalised components combined to a 0–100 figure vs a reference", "dirn": "↓ Lower is better", "win": "Walk-through audit: 1 day per station, 2–3 days per corridor (day + night). Re-audit after any physical modification.", "lim": "Auditor perception of 'concealment' is subjective. Vegetation grows seasonally — summer audit may miss winter visibility issues. Does not capture temporal dimension (a space safe during rush hour may be dangerous at midnight). Cultural differences in space perception."}, {"id": "S-D03", "dom": "S", "fun": "D", "funl": {"en": "Determinant", "es": "Determinante", "pt": "Determinante"}, "lvl": "N", "op": "Observed", "dt": "Index", "unit": "Composite score (0–100)", "refs": 7, "sdg": "", "v1": "PS-21", "name": {"en": "Corridors with natural surveillance (eyes on the street)", "es": "Corredores con vigilancia natural (ojos en la calle)", "pt": "Corredores com vigilância natural (olhos na rua)"}, "trig": {"en": "public space / corridors", "es": "espacio público / corredores", "pt": "espaço público / corredores"}, "subj": {"en": "Corridors", "es": "Corredores", "pt": "Corredores"}, "scope": {"en": "[treated corridors]", "es": "[corredores intervenidos]", "pt": "[corredores intervencionados]"}, "thr": {"en": "No standard; audit / mapping of human presence. Local target.", "es": "Sin norma; auditoría / cartografía de presencia humana. Meta local.", "pt": "Sem norma; auditoria / mapeamento de presença humana. Meta local."}, "thrt": {"en": "No standard — local baseline and target", "es": "Sin norma — línea base y meta locales", "pt": "Sem norma — linha de base e meta locais"}, "src": {"en": "Vecchio (interview)", "es": "Vecchio (entrevista)", "pt": "Vecchio (interview)"}, "expert": {"en": "Vecchio (human presence on routes)", "es": "Vecchio (presencia humana en rutas)", "pt": "Vecchio (human presence on routes)"}, "desc": "Composite measure of natural surveillance conditions on transit corridors: land use mix, active building frontages, pedestrian footfall, setback distance, and window-to-wall ratio", "how": "Street-level audit scoring land use diversity, ground-floor activity, building setback, frontage transparency, pedestrian density at transit corridors. See “Composite Scoring Rubrics” sheet.", "dis": "Sexo; Edad; Corridor; Zone; Land use type", "calc": "normalised components combined to a 0–100 figure vs a reference", "dirn": "↑ Higher is better", "win": "Street-level audit: 1–2 weeks per corridor (must include evening/night observation). Repeat annually or after major land-use changes.", "lim": "Jane Jacobs' concept is intuitive but operationalising it is contested. Active frontage ≠ actual surveillance — busy shops don't mean people are watching. Evening/night conditions differ dramatically from daytime. Index weights are normative."}, {"id": "S-D04", "dom": "S", "fun": "D", "funl": {"en": "Determinant", "es": "Determinante", "pt": "Determinante"}, "lvl": "N", "op": "Observed", "dt": "Index", "unit": "Index 0–100", "refs": 4, "sdg": "", "v1": "PS-06", "name": {"en": "Visible staff presence & responsiveness at stations", "es": "Presencia visible y respuesta del personal en estaciones", "pt": "Presença visível e capacidade de resposta do pessoal nas estações"}, "trig": {"en": "station / public transport", "es": "estación / TP", "pt": "estação / TP"}, "subj": {"en": "Staff", "es": "Personal", "pt": "Pessoal"}, "scope": {"en": "[treated stations]", "es": "[estaciones intervenidas]", "pt": "[estações intervencionadas]"}, "thr": {"en": "No standard; operator baseline.", "es": "Sin norma; línea base del operador.", "pt": "Sem norma; linha de base do operador."}, "thrt": {"en": "No standard — local baseline and target", "es": "Sin norma — línea base y meta locales", "pt": "Sem norma — linha de base e meta locais"}, "src": {"en": "—", "es": "—", "pt": "—"}, "expert": {"en": "", "es": "", "pt": ""}, "desc": "Assessment of visible staff presence and responsiveness at the station: uniformed personnel on platform, at entries, and in concourse; response time to passenger requests; presence during all operating hours.", "how": "Mystery shopper + structured observation: visible staff per 1,000 passengers (25 pts), response time to help request (25 pts), coverage of operating hours (25 pts), staff approachability rating from p. See “Composite Scoring Rubrics” sheet.", "dis": "Sexo; Edad; Time of day (peak/off-peak/night); Day type (weekday/weekend); Staff type (security/customer service)", "calc": "normalised components combined to a 0–100 figure vs a reference", "dirn": "↑ Higher is better", "win": "Mystery shopper + observation: 1 week per assessment. Must include morning peak, evening peak, and late-night periods. Quarterly in first year.", "lim": "Mystery shopper methodology has inherent subjectivity. Staff presence at assessment time may not reflect typical coverage (understaffing, break schedules). Does not capture staff quality (present but disengaged). Contracted security vs. operator staff have different authority and training."}, {"id": "S-D05", "dom": "S", "fun": "D", "funl": {"en": "Determinant", "es": "Determinante", "pt": "Determinante"}, "lvl": "N", "op": "Observed", "dt": "Index", "unit": "Composite score (0–5)", "refs": 9, "sdg": "", "v1": "PS-08", "name": {"en": "Functional harassment-reporting mechanisms", "es": "Mecanismos de denuncia de acoso implementados y funcionales", "pt": "Mecanismos de denúncia de assédio implementados e funcionais"}, "trig": {"en": "public transport; gender policy", "es": "transporte público; política de género", "pt": "transporte público; política de gênero"}, "subj": {"en": "Mechanisms", "es": "Mecanismos", "pt": "Mecanismos"}, "scope": {"en": "[system]", "es": "[sistema]", "pt": "[sistema]"}, "thr": {"en": "Dichotomous + functionality: exists, publicised (iconography), with response and psychological support (Allen).", "es": "Dicotómico + funcionalidad: existe, difundido (iconografía), con respuesta y apoyo psicológico (Allen).", "pt": "Dicotômico + funcionalidade: existe, divulgado (iconografia), com resposta e apoio psicológico (Allen)."}, "thrt": {"en": "Dichotomous (exists / implemented)", "es": "Dicotómico (existe / implementado)", "pt": "Dicotômico (existe / implementado)"}, "src": {"en": "Allen (interview)", "es": "Allen (entrevista)", "pt": "Allen (interview)"}, "expert": {"en": "Allen (robust complaints system)", "es": "Allen (sistema de quejas robusto)", "pt": "Allen (robust complaints system)"}, "desc": "Presence and functionality of harassment reporting mechanisms in transit (hotline, app, in-station button, trained staff)", "how": "Operator audit: inventory of reporting channels; assess functionality (response time, follow-up protocol, language accessibility); test with mystery reports. See “Composite Scoring Rubrics” sheet.", "dis": "Sexo; Edad; Channel type; Accessibility; Language availability", "calc": "normalised components combined to a 0–100 figure vs a reference", "dirn": "↑ Higher is better", "win": "Infrastructure audit: 1 week. Reporting system usage data requires 6+ months to establish baseline patterns.", "lim": "Measures mechanism existence, not accessibility or trustworthiness. Many victims do not use formal mechanisms regardless of availability. Digital reporting requires smartphone access — excludes low-income users. 'Mechanism exists' ≠ 'mechanism works'.  [v2: never interpret report counts alone — anchor to prevalence (PS-29) and a trust measure; falling reports may signal lost trust, not less harm.]"}, {"id": "S-D06", "dom": "S", "fun": "D", "funl": {"en": "Determinant", "es": "Determinante", "pt": "Determinante"}, "lvl": "N", "op": "Observed", "dt": "Number", "unit": "Vehicles per hour", "refs": 7, "sdg": "", "v1": "PS-12", "name": {"en": "Service frequency incl. night (priority corridors)", "es": "Frecuencia de servicio (incl. nocturna) en corredores prioritarios", "pt": "Frequência do serviço (incl. noturna) em corredores prioritários"}, "trig": {"en": "PT operations; women’s night-time safety", "es": "operación de TP; seguridad nocturna de mujeres", "pt": "operação de TP; segurança noturna das mulheres"}, "subj": {"en": "Service", "es": "Servicio", "pt": "Serviço"}, "scope": {"en": "[priority corridors]", "es": "[corredores prioritarios]", "pt": "[corredores prioritários]"}, "thr": {"en": "Planning convention (no standard): “frequent” ≈ ≥ 4–6 veh/h (headway ≤ 10–15 min); night ≥ 2 veh/h.", "es": "Convención de planificación (sin norma): “frecuente” ≈ ≥ 4–6 veh/h (intervalo ≤ 10–15 min); nocturno ≥ 2 veh/h.", "pt": "Convenção de plan r", "win": "Survey: 2–3 weeks per round. Minimum n=400. Readiness is attitudinal — behavioural change requires 12–24 months to materialise after training.", "lim": "Attitudinal measures (willingness to intervene) do not predict actual behaviour reliably. Social desirability bias inflates self-reported readiness. Cultural norms around intervention vary widely. No validated scale exists for transport-specific bystander behaviour."}, {"id": "S-D11", "dom": "S", "fun": "D", "funl": {"en": "Determinant", "es": "Determinante", "pt": "Determinante"}, "lvl": "C", "op": "Observed", "dt": "Index", "unit": "Index (0–100)", "refs": 8, "sdg": "", "v1": "PS-05", "name": {"en": "Women’s tactical safety repertoire (higher = worse environment)", "es": "Precauciones que las mujeres adoptan rutinariamente para viajar (repertorio táctico; mayor = peor)", "pt": "Precauções que as mulheres adotam rotineiramente para viajar (repertório tático; maior = pior)"}, "trig": {"en": "gender diagnosis", "es": "diagnóstico de género", "pt": "diagnóstico de gênero"}, "subj": {"en": "Women", "es": "Mujeres", "pt": "Mulheres"}, "scope": {"en": "[area of influence]", "es": "[área de influencia]", "pt": "[área de influência]"}, "thr": {"en": "No standard; higher = worse; baseline.", "es": "Sin norma; mayor = peor; línea base.", "pt": "Sem norma; maior = pior; linha de base."}, "thrt": {"en": "No standard — local baseline and target", "es": "Sin norma — línea base y meta locales", "pt": "Sem norma — linha de base e meta locais"}, "src": {"en": "Allen (interview)", "es": "Allen (entrevista)", "pt": "Allen (interview)"}, "expert": {"en": "Allen (women’s strategies)", "es": "Allen (estrategias de las mujeres)", "pt": "Allen (women’s strategies)"}, "desc": "Composite index of safety precautions routinely adopted by women: accompanying others, altering dress, limiting night travel, avoiding specific locations, carrying protection items", "how": "Survey instrument measuring frequency and range of safety precautions; calculate composite weighted by restriction severity. See “Composite Scoring Rubrics” sheet.", "dis": "Sexo; Edad; Age group; Income quintile; Mode; Time of day; Household type", "calc": "normalised components combined to a 0–100 figure vs a reference", "dirn": "↓ Lower is better  [v2: higher = worse environment (coping is a symptom of unsafety).]", "win": "Qualitative + quantitative survey: 3–4 weeks fieldwork. Minimum n=300 women. 12-month intervals for change tracking.", "lim": "Novel measure with no established psychometric validity. Repertoire complexity ≠ safety outcomes — some tactics are adaptive, others may increase risk. Cultural variation makes cross-city comparison problematic. May normalise the burden of safety work placed on women."}, {"id": "S-D12", "dom": "S", "fun": "D", "funl": {"en": "Determinant", "es": "Determinante", "pt": "Determinante"}, "lvl": "N", "op": "—", "dt": "Percentage", "unit": "%", "refs": 0, "sdg": "", "v1": "PS-18", "name": {"en": "Women in the transport workforce", "es": "Mujeres vinculadas a la fuerza laboral del transporte", "pt": "Mulheres na força de trabalho do transporte"}, "trig": {"en": "employability / gender component", "es": "componente de empleabilidad / género", "pt": "componente de empregabilidade / gênero"}, "subj": {"en": "Women", "es": "Mujeres", "pt": "Mulheres"}, "scope": {"en": "[entities / contractors]", "es": "[entidades / contratistas]", "pt": "[entidades / contratadas]"}, "thr": {"en": "Empirical reference: women ≈ 12 % of the global transport workforce (5 % in land transport) — WB 2025. Target: parity (50 %) or programme target.", "es": "Referencia empírica: mujeres ≈ 12 % de la fuerza laboral mundial de transporte (5 % en transporte terrestre) — BM 2025. Meta: paridad (50 %) o meta del programa.", "pt": "Referência empírica: mulheres ≈ 12 % da força de trabalho mundial do transporte (5 % no transporte terrestre) — BM 2025. Meta: paridade (50 %) ou meta do programa."}, "thrt": {"en": "Empirical reference", "es": "Referencia empírica", "pt": "Referência empírica"}, "src": {"en": "World Bank, Gender & Transport (Kurshitashvili et al. 2025)", "es": "World Bank, Gender & Transport (Kurshitashvili et al. 2025)", "pt": "World Bank, Gender & Transport (Kurshitashvili et al. 2025)"}, "expert": {"en": "", "es": "", "pt": ""}, "desc": "% of women in transport sector workforce (operator, planning, management levels)", "how": "HR data from transit operators and transport agencies; report % women at: operational, technical/planning, and management/leadership levels", "dis": "Sexo; Edad; Level (operator/planning/management); Age group; Seniority", "calc": "(units meeting the condition) ÷ (total units in scope) × 100", "dirn": "↑ Higher is better", "win": "HR data extraction: 1–2 weeks. Annual measurement aligned with fiscal year.", "lim": "Measures representation, not workplace quality or safety. Headline percentage may mask concentration in low-level positions. Does not capture workplace harassment or retention rates. May incentivise tokenism over genuine inclusion."}, {"id": "A-D01", "dom": "A", "fun": "D", "funl": {"en": "Determinant", "es": "Determinante", "pt": "Determinante"}, "lvl": "E", "op": "Observed", "dt": "Number", "unit": "µg/m³", "refs": 15, "sdg": "11.6.2", "v1": "EN-03, EN-20", "name": {"en": "Air quality & pollutant exposure on transport corridors", "es": "Calidad del aire y exposición a contaminantes en corredores de transporte", "pt": "Qualidade do ar e exposição a poluentes em corredores de transporte"}, "trig": {"en": "(always)", "es": "(siempre)", "pt": "(sempre)"}, "subj": {"en": "Corridors / active travellers", "es": "Corredores / viajeros activos", "pt": "Corredores / viajantes ativos"}, "scope": {"en": "[treated corridors]", "es": "[corredores intervenidos]", "pt": "[corredores intervencionados]"}, "thr": {"en": "Standard: WHO Air Quality Guidelines 2021 — PM2.5 annual 5 µg/m³ and 24-h 15; PM10 annual 15 and 24-h 45; NO₂ annual 10 and 24-h 25 µg const KEY='smc_feedback_v1';let FBK={};try{FBK=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){FBK={}}
function saveFB(){try{localStorage.setItem(KEY,JSON.stringify(FBK))}catch(e){}}
function who(){return (FBK.__who||'')}
let L='en',view='cards',F={dom:new Set(),lvl:new Set(),fun:new Set(),op:new Set(),dt:new Set()},q='',essOnly=false,open=new Set();
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function chips(id,key,vals,cls){const el=$(id);el.innerHTML='';vals.forEach(([k,lab])=>{const c=document.createElement('span');c.className='chip '+(cls?k:'')+(F[key].has(k)?' on':'');c.textContent=lab;c.onclick=()=>{F[key].has(k)?F[key].delete(k):F[key].add(k);render();};el.appendChild(c);});}
function labels(){const u=UI[L];document.documentElement.lang=L;$('#t').textContent=u.title;$('#q').placeholder=u.search;$('#l-search').textContent=u.search.split(' ')[0];
 $('#l-dom').textContent=u.domain;$('#l-lvl').textContent=u.level;$('#l-fun').textContent=u.func;$('#l-op').textContent=u.op;$('#l-dt').textContent=u.dt;$('#b-clear').textContent=u.clear;$('#b-ess').textContent=u.ess;$('#b-view').textContent=view==='cards'?u.table:u.cards;$('#b-print').textContent=u.print;$('#l-who').textContent=u.who;$('#help').textContent=u.help;
 document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));$('#b-ess').classList.toggle('on',essOnly);
 chips('#f-dom','dom',Object.entries(u.dom),true);chips('#f-lvl','lvl',Object.entries(u.lvl));chips('#f-fun','fun',Object.entries(u.fun));chips('#f-op','op',Object.entries(u.opv).filter(([k])=>k!=='—'));chips('#f-dt','dt',Object.entries(u.dtv));}
function hay(d){return [d.id,d.name.en,d.name.es,d.name.pt,d.trig.en,d.trig.es,d.trig.pt,d.desc,d.how,d.subj[L],d.thr[L]].join(' ').toLowerCase();}
function filtered(){const s=q.trim().toLowerCase();return DATA.filter(d=>(!essOnly||d.lvl==='E')&&(!F.dom.size||F.dom.has(d.dom))&&(!F.lvl.size||F.lvl.has(d.lvl))&&(!F.fun.size||F.fun.has(d.fun))&&(!F.op.size||F.op.has(d.op))&&(!F.dt.size||F.dt.has(d.dt))&&(!s||hay(d).includes(s)));}
function dl(k,v,en){return v?`<dt>${esc(k)}${en?esc(UI[L].enonly):''}</dt><dd>${esc(v)}</dd>`:'';}
function fbBlock(d){const u=UI[L],f=FBK[d.id]||{};const opt=(k,lab)=>`<span class="opt${f.vote===k?' on':''}" data-v="${k}">${esc(lab)}</span>`;
 return `<div class="fb" data-id="${d.id}"><h4>${esc(u.fb)}</h4><div class="opts">${opt('keep',u.keep)}${opt('change',u.change)}${opt('drop',u.drop)}</div>
 <select class="lvl"><option value="">${esc(u.lvlq)}…</option>${['E','C','N'].map(k=>`<option value="${k}"${f.lvl===k?' selected':''}>${esc(u.lvl[k])}</option>`).join('')}</select>
 <textarea placeholder="${esc(u.comment)}">${esc(f.text||'')}</textarea><button class="send">${esc(u.send)}</button><div class="st">${f.sent?esc(u.sent):(f.vote||f.lvl||f.text)?esc(u.saved):''}</div></div>`;}
function hasFB(id){const f=FBK[id];return f&&(f.vote||f.lvl||f.text);}
function card(d){const u=UI[L];return `<div class="card ${d.dom}${open.has(d.id)?' open':''}" data-id="${d.id}"><button class="cbtn${hasFB(d.id)?' has':''}">${esc(u.cbtn)}</button><div class="id">${d.id}</div><h3>${esc(d.name[L])}</h3>
<div class="tags"><span class="tag ${d.lvl}">${esc(u.lvl[d.lvl])}</span><span class="tag fun">${esc(d.funl[L])}</span><span class="tag">${esc(u.opv[d.op]||d.op)}</span><span class="tag">${esc(u.dtv[d.dt]||d.dt)}</span></div>
<div class="trig"><b>${esc(u.trigger)}:</b> ${esc(d.trig[L])}</div>
<dl class="det">${dl(u.desc,d.desc,true)}${dl(u.subject,d.subj[L])}${dl(u.scope,d.scope[L])}${dl(u.unit,d.unit)}${dl(u.calc,d.calc,true)}${dl(u.dirn,d.dirn,true)}${dl(u.dis,d.dis,true)}${dl(u.how,d.how,true)}${dl(u.win,d.win,true)}${dl(u.thr,d.thr[L])}${dl(u.thrt,d.thrt[L])}${dl(u.src,d.src[L])}${dl(u.sdg,d.sdg)}</dl>${fbBlock(d)}</div>`;}
function table(rows){const u=UI[L];return `<table class="tbl"><thead><tr><th>ID</th><th>${esc(u.domain)}</th><th>${esc(u.level)}</th><th>${esc(u.func)}</th><th>${esc(u.title.split(' ')[0]==='Safe'?'Indicator':'Indicador')}</th><th>${esc(u.trigger)}</th><th>${esc(u.unit)}</th><th>${esc(u.op)}</th><th>${esc(u.thrt)}</th></tr></thead><tbody>${rows.map(d=>`<tr class="${d.dom}"><td><b>${d.id}</b></td><td>${esc(u.dom[d.dom])}</td><td>${esc(u.lvl[d.lvl])}</td><td>${esc(d.funl[L])}</td><td>${esc(d.name[L])}</td><td>${esc(d.trig[L])}</td><td>${esc(d.unit)}</td><td>${esc(u.opv[d.op]||d.op)}</td><td>${esc(d.thrt[L])}</td></tr>`).join('')}</tbody></table>`;}
function render(){labels();const u=UI[L],rows=filtered();const n={T:0,S:0,A:0};rows.forEach(d=>n[d.dom]++);
 $('#count').innerHTML=`<span><b>${rows.length}</b> ${u.of} ${DATA.length}</span><span><span class="dot" style="background:var(--blue)"></span>${esc(u.dom.T)}: <b>${n.T}</b></span><span><span class="dot" style="background:var(--red)"></span>${esc(u.dom.S)}: <b>${n.S}</b></span><span><span class="dot" style="background:var(--green)"></span>${esc(u.dom.A)}: <b>${n.A}</b></span><span>${view==='cards'?esc(u.expand):''}</span>`;
 $('#out').innerHTML=rows.length?(view==='cards'?`<div class="grid">${rows.map(card).join('')}</div>`:table(rows)):`<div class="empty">${esc(u.nores)}</div>`;
 document.querySelectorAll('.cbtn').forEach(b=>b.onclick=e=>{e.stopPropagation();b.closest('.card').querySelector('.fb').classList.toggle('show');});
 document.querySelectorAll('.card').forEach(c=>c.onclick=e=>{if(e.target.closest('.fb')||e.target.closest('.cbtn'))return;const id=c.dataset.id;open.has(id)?open.delete(id):open.add(id);c.classList.toggle('open');});
 document.querySelectorAll('.fb').forEach(b=>{const id=b.dataset.id;const upd=()=>{FBK[id]=FBK[id]||{};FBK[id].lvl=b.querySelector('.lvl').value;FBK[id].text=b.querySelector('textarea').value;FBK[id].when=new Date().toISOString();saveFB();b.querySelector('.st').textContent=UI[L].saved;b.closest('.card').querySelector('.cbtn').classList.toggle('has',!!hasFB(id));updMine();};
  b.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{FBK[id]=FBK[id]||{};FBK[id].vote=(FBK[id].vote===o.dataset.v?'':o.dataset.v);b.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x.dataset.v===FBK[id].vote));upd();});
  b.querySelector('.lvl').onchange=upd;b.querySelector('textarea').oninput=upd;
  b.querySelector('.send').onclick=async()=>{upd();const u=UI[L],f=FBK[id],d=DATA.find(x=>x.id===id),st=b.querySelector('.st'),btn=b.querySelector('.send');
   if(!(f.vote||f.lvl||f.text)){return;}
   if(!CONFIG.endpoint){st.textContent=u.noend;return;}
   const payload={id,name:d.name[L],vote:f.vote||'',suggested_level:f.lvl?u.lvl[f.lvl]:'',comment:f.text||'',who:who(),lang:L,when:new Date().toISOString(),ua:navigator.userAgent.slice(0,80)};
   btn.disabled=true;st.textContent=u.sending;
   try{if(CONFIG.endpointType==='apps-script'){await fetch(CONFIG.endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});}
    else{const r=await fetch(CONFIG.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok)throw new Error(r.status);}
    f.sent=true;saveFB();st.textContent=u.sent;}catch(e){st.textContent=u.senderr;}
   btn.disabled=false;};});
 updMine();}
function rowsFB(){return DATA.filter(d=>hasFB(d.id)).map(d=>{const f=FBK[d.id],u=UI[L];return {id:d.id,name:d.name[L],vote:f.vote?{keep:u.keep,change:u.change,drop:u.drop}[f.vote]:'',lvl:f.lvl?u.lvl[f.lvl]:'',text:f.text||'',who:who(),when:f.when||''};});}
function updMine(){const n=rowsFB().length,u=UI[L];$('#b-mine').textContent=`${u.mine} (${n})`;}
function fbText(){return rowsFB().map(r=>`${r.id} · ${r.name}\n${r.vote}${r.lvl?' · '+r.lvl:''}\n${r.text}`).join('\n\n')+(who()?`\n\n— ${who()}`:'');}
function csvFB(){const q=v=>'"'+String(v).replace(/"/g,'""')+'"';return ['id,indicator,vote,suggested_level,comment,who,when'].concat(rowsFB().map(r=>[r.id,r.name,r.vote,r.lvl,r.text,r.who,r.when].map(q).join(','))).join('\n');}
function openModal(){const u=UI[L],rows=rowsFB();$('#m-title').textContent=`${u.mine} (${rows.length})`;$('#m-list').innerHTML=rows.length?rows.map(r=>`<div class="row"><b>${r.id}</b> ${esc(r.name)}<br>${esc(r.vote)}${r.lvl?' · '+esc(r.lvl):''}${r.text?'<br>'+esc(r.text):''}</div>`).join(''):`<div class="row">${esc(u.none)}</div>`;
 $('#m-csv').textContent=u.csv;$('#m-copy').textContent=u.copy;$('#m-mail').textContent=u.mail;$('#m-close').textContent=u.close;$('#modal').classList.add('on');}
$('#b-mine').onclick=openModal;$('#m-close').onclick=()=>$('#modal').classList.remove('on');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('on');};
$('#m-csv').onclick=()=>{const b=new Blob(['\ufeff'+csvFB()],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='safe_mobility_catalogue_comments.csv';a.click();};
$('#m-copy').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(fbText());};
$('#m-mail').onclick=()=>{if(!CONFIG.feedbackEmail){alert(UI[L].mailhint);return;}location.href=`mailto:${CONFIG.feedbackEmail}?subject=${encodeURIComponent('Safe Mobility Catalogue — comments')}&body=${encodeURIComponent(fbText())}`;};
$('#who').value=who();$('#who').oninput=e=>{FBK.__who=e.target.value;saveFB();};
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;render();});
$('#q').oninput=e=>{q=e.target.value;render();};$('#b-clear').onclick=()=>{Object.values(F).forEach(s=>s.clear());q='';$('#q').value='';essOnly=false;render();};
$('#b-ess').onclick=()=>{essOnly=!essOnly;render();};$('#b-view').onclick=()=>{view=view==='cards'?'table':'cards';render();};$('#b-print').onclick=()=>{open=new Set(DATA.map(d=>d.id));render();window.print();};
render();
</script></body></html>
